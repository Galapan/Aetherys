<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/media/brand/aetherys-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Diseñamos y desarrollamos sitios web, plataformas y soluciones con IA. Te acompañamos desde la primera idea hasta su puesta en marcha."
    />
    <meta name="theme-color" content="#101014" />
    <!-- Link previews. Absolute URLs use the Vercel address until the own domain exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aetherys" />
    <meta property="og:title" content="Aetherys — Software a medida" />
    <meta
      property="og:description"
      content="Diseñamos y desarrollamos sitios web, plataformas y soluciones con IA. Te acompañamos desde la primera idea hasta su puesta en marcha."
    />
    <meta property="og:url" content="https://aetherys.vercel.app/" />
    <meta property="og:image" content="https://aetherys.vercel.app/media/brand/aetherys-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logotipo de Aetherys" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Aetherys</title>
    <script>
      // Paints the intro's first frame (a closed curtain) before the bundle loads; the hero
      // intro removes it as it takes over. Lifted anyway if the app never starts.
      if (
        location.pathname.replace(/\/+$/, '') === '' &&
        !matchMedia('(prefers-reduced-motion: reduce)').matches
      ) {
        document.documentElement.classList.add('intro-pending')
        setTimeout(() => document.documentElement.classList.remove('intro-pending'), 8000)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
